# Dependabot version updates.
#
# Groups are matched in order and the FIRST match wins, so they run from the
# most specific to the most general. Every lockstep set moves as one PR, all
# update types (major included), because a PR that moves one member alone
# goes red:
#
# - `toolchain`: vite-plus pins `oxlint`, `oxfmt`, `oxlint-tsgolint` and
#   `vitest` to exact versions, `vite` is its aliased core and
#   `@vitest/coverage-istanbul` must equal its vitest; `effect-tsgo patch`
#   (the `prepare` step) matches the native `tsc` (`@typescript/native`) and
#   `oxlint` by gitHead and hard-errors on any pairing it has no artifact
#   for; `typescript` is the TS6 alias (`@typescript/typescript6`) beside it;
#   the Effect oxlint plugin loads inside that oxlint. See the catalog
#   comments in pnpm-workspace.yaml before merging one.
# - `docgen`: `@effect/docgen` runs its examples under `tsx`. Listed before
#   `effect` so `@effect/docgen` does not land in the `effect` group.
# - `changesets`, `fallow`: their own release cadence.
# - `effect`: the lockstep-versioned Effect release line (`effect`,
#   `@effect/language-service`), minus `@effect/tsgo` (toolchain).
# - `minor-and-patch`: everything else (`@types/node`); a major of one of
#   these opens its own PR.
#
# `cooldown` mirrors pnpm-workspace.yaml's `minimumReleaseAge` (1 day), with
# the same first-party exemption.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    cooldown:
      default-days: 1
      exclude:
        - "@thomasfosterau/*"
    groups:
      toolchain:
        applies-to: version-updates
        patterns:
          - "vite-plus"
          - "vite"
          - "vitest"
          - "@vitest/*"
          - "oxlint"
          - "oxfmt"
          - "oxlint-tsgolint"
          - "@effect/tsgo"
          - "@typescript/native"
          - "typescript"
          - "@typescript/typescript6"
          - "@mpsuesser/oxlint-plugin-effect"
        update-types: ["major", "minor", "patch"]
      docgen:
        applies-to: version-updates
        patterns:
          - "@effect/docgen"
          - "tsx"
        update-types: ["major", "minor", "patch"]
      changesets:
        applies-to: version-updates
        patterns:
          - "@changesets/*"
        update-types: ["major", "minor", "patch"]
      fallow:
        applies-to: version-updates
        patterns:
          - "fallow"
        update-types: ["major", "minor", "patch"]
      effect:
        applies-to: version-updates
        patterns:
          - "effect"
          - "@effect/*"
        exclude-patterns:
          - "@effect/tsgo"
          - "@effect/docgen"
        update-types: ["major", "minor", "patch"]
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
